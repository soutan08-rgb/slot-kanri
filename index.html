<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>パチスロ収支管理</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#e8edf7;background:#0b1120}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:760px;margin:auto;padding:16px}h1{font-size:23px;margin:8px 0 16px}h2{font-size:17px;margin:0 0 12px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:18px}.tabs button{flex:1;white-space:nowrap}.panel{background:#182235;border:1px solid #2b3a50;border-radius:16px;padding:16px;margin-bottom:14px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#202e43;border-radius:12px;padding:12px}.metric small{display:block;color:#acbbce;margin-bottom:7px}.metric strong{font-size:21px}label{display:block;font-size:13px;color:#b9c6d8;margin-bottom:6px}input,select,textarea{width:100%;background:#0e1829;border:1px solid #40516a;border-radius:9px;color:#fff;padding:12px;font-size:16px;margin-bottom:12px}button{background:#30415b;color:#fff;border:0;border-radius:10px;padding:11px 13px;font-size:14px;font-weight:650;cursor:pointer}button.primary{background:#2c78e8}button.danger{background:#8e3040}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#a7b6ca;font-size:13px}.positive{color:#4fdfa3}.negative{color:#ff7885}.item{padding:12px 0;border-bottom:1px solid #344157}.item:last-child{border:0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.hidden{display:none!important}canvas{width:100%;height:220px;display:block}.pill{border-radius:999px;background:#293b55;padding:4px 9px;font-size:12px}#notice{color:#8ee0bd;font-size:13px;min-height:18px}summary{cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap} .actions button{flex:1} .help{line-height:1.6} .yearpick{max-width:160px} @media(max-width:370px){.metric strong{font-size:18px}}
</style></head><body><main><h1>🎰 パチスロ収支管理</h1><nav class="tabs"><button data-tab="home">集計</button><button data-tab="entry">記録</button><button data-tab="history">履歴</button><button data-tab="analysis">分析</button><button data-tab="settings">データ</button></nav><div id="notice" role="status"></div>
<section id="home" class="tab"><div class="panel"><div class="row"><h2>収支サマリー</h2><select id="period" style="width:auto;margin:0"><option value="month">今月</option><option value="year">今年</option><option value="all">全期間</option></select></div><div class="metrics" id="metrics"></div></div><div class="panel"><h2>月別収支（選択年）</h2><select class="yearpick" id="chartYear"></select><canvas id="monthly" aria-label="月別収支グラフ"></canvas></div><div class="panel"><h2>年間収支</h2><canvas id="yearly" aria-label="年間収支グラフ"></canvas></div></section>
<section id="entry" class="tab hidden"><div class="panel"><h2 id="formTitle">実戦を記録</h2><form id="recordForm"><input id="editId" type="hidden"><label for="date">日付</label><input id="date" type="date" required><label for="machine">機種名</label><input id="machine" list="machines" placeholder="例：スマスロ北斗の拳" required maxlength="100"><datalist id="machines"></datalist><div class="grid"><div><label for="investment">投資額（円）</label><input id="investment" type="number" min="0" step="1" value="0" required></div><div><label for="returnAmount">回収額（円）</label><input id="returnAmount" type="number" min="0" step="1" value="0" required></div></div><div class="grid"><div><label for="start">開始時間</label><input id="start" type="time"></div><div><label for="end">終了時間</label><input id="end" type="time"></div></div><p class="muted">終了が開始より早い場合は翌日終了として計算します。時間未入力の場合、時給は計算しません。</p><div class="grid"><div><label for="coins">差枚数（枚）</label><input id="coins" type="number" step="1" placeholder="例：1200"></div><div><label for="games">ゲーム数（G）</label><input id="games" type="number" min="0" step="1" placeholder="例：3500"></div></div><label for="setting">設定（推定含む）</label><select id="setting"><option value="">不明</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select><label for="memo">メモ</label><textarea id="memo" rows="3" maxlength="1000" placeholder="立ち回りや設定根拠など"></textarea><div class="actions"><button type="submit" class="primary">保存する</button><button type="button" id="resetForm">入力をクリア</button></div></form></div></section>
<section id="history" class="tab hidden"><div class="panel"><h2>実戦履歴</h2><input id="filter" placeholder="機種名・メモで検索"><div id="records"></div></div></section>
<section id="analysis" class="tab hidden"><div class="panel"><h2>機種別分析</h2><div id="machineStats"></div></div><div class="panel"><h2>設定別分析</h2><div id="settingStats"></div></div></section>
<section id="settings" class="tab hidden"><div class="panel"><h2>バックアップ・出力</h2><p class="muted help">データはこの端末のブラウザ内に保存されます。Safariのデータ削除や端末変更に備え、定期的にJSONバックアップを保存してください。</p><div class="actions"><button id="csvExport">CSV出力</button><button id="jsonExport">JSONバックアップ</button></div><label for="jsonImport" style="margin-top:18px">JSONバックアップを復元（現在の記録を置換）</label><input type="file" id="jsonImport" accept="application/json,.json"><button id="clearAll" class="danger">全記録を削除</button></div><div class="panel"><h2>使い方</h2><p class="muted help">GitHub PagesなどHTTPSの公開先に配置すると、iPhoneのSafariで「共有」→「ホーム画面に追加」からアプリとして使用できます。オフライン対応は初回のオンライン起動後に有効になります。</p></div></section>
</main><script>
'use strict';const KEY='slot-profit-v1';let entries=[];let active='home';const $=id=>document.getElementById(id);const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n);const num=n=>new Intl.NumberFormat('ja-JP').format(n);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const localDate=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const profit=r=>r.returnAmount-r.investment;const duration=r=>{if(!r.start||!r.end)return null;let [h,m]=r.start.split(':').map(Number),[hh,mm]=r.end.split(':').map(Number);let t=hh*60+mm-h*60-m;if(t<0)t+=1440;return t};const fmtTime=m=>m===null?'—':`${Math.floor(m/60)}時間${m%60}分`;const cls=n=>n>0?'positive':n<0?'negative':'';function notice(s){$('notice').textContent=s;setTimeout(()=>{if($('notice').textContent===s)$('notice').textContent=''},4000)}
function validate(r){return r&&typeof r.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&typeof r.machine==='string'&&r.machine.trim()&&Number.isSafeInteger(r.investment)&&r.investment>=0&&Number.isSafeInteger(r.returnAmount)&&r.returnAmount>=0&&Number.isSafeInteger(r.coins)&&Number.isSafeInteger(r.games)&&r.games>=0&&(!r.start||/^([01]\d|2[0-3]):[0-5]\d$/.test(r.start))&&(!r.end||/^([01]\d|2[0-3]):[0-5]\d$/.test(r.end))&&(!r.setting||/^[1-6]$/.test(r.setting))&&typeof r.memo==='string'}
function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');entries=Array.isArray(a)?a.filter(validate):[]}catch{entries=[];notice('保存データの読み込みに失敗しました')}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(entries));return true}catch{alert('保存に失敗しました。ストレージの空き容量やSafari設定を確認してください。');return false}}
function show(tab){active=tab;document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('hidden',e.id!==tab));document.querySelectorAll('[data-tab]').forEach(e=>e.style.background=e.dataset.tab===tab?'#2c78e8':'#30415b');render()}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));
function aggregate(a){let p=a.reduce((s,r)=>s+profit(r),0),wins=a.filter(r=>profit(r)>0).length,mins=a.reduce((s,r)=>s+(duration(r)||0),0);return{p,wins,mins,count:a.length,rate:a.length?wins/a.length*100:0,hourly:mins?p/(mins/60):null}}function metric(label,value,kind=''){return `<div class="metric"><small>${label}</small><strong class="${kind}">${value}</strong></div>`}
function renderHome(){const today=localDate(),mode=$('period').value;let a=entries.filter(r=>mode==='all'||(mode==='year'?r.date.slice(0,4)===today.slice(0,4):r.date.slice(0,7)===today.slice(0,7)));let x=aggregate(a);$('metrics').innerHTML=metric('収支',yen(x.p),cls(x.p))+metric('勝率',x.rate.toFixed(1)+'%')+metric('実戦回数',num(x.count)+'回')+metric('時給',x.hourly===null?'—':yen(Math.round(x.hourly)),cls(x.hourly))+metric('遊技時間',fmtTime(x.mins))+metric('勝ち / 負け / 引分',`${x.wins} / ${a.filter(r=>profit(r)<0).length} / ${a.filter(r=>profit(r)===0).length}`);const years=[...new Set([today.slice(0,4),...entries.map(r=>r.date.slice(0,4))])].sort((a,b)=>b.localeCompare(a));let current=$('chartYear').value||today.slice(0,4);$('chartYear').innerHTML=years.map(y=>`<option ${y===current?'selected':''}>${y}</option>`).join('');if(!years.includes(current))current=years[0];const months=Array.from({length:12},(_,i)=>entries.filter(r=>r.date.slice(0,7)===`${current}-${String(i+1).padStart(2,'0')}`).reduce((s,r)=>s+profit(r),0));draw('monthly',months,Array.from({length:12},(_,i)=>`${i+1}月`));draw('yearly',years.slice().reverse().map(y=>entries.filter(r=>r.date.startsWith(y)).reduce((s,r)=>s+profit(r),0)),years.slice().reverse())}
function draw(id,values,labels){const c=$(id),w=c.clientWidth||320,h=220,dpr=window.devicePixelRatio||1;c.width=Math.round(w*dpr);c.height=h*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const L=10,R=8,T=18,B=35,plotH=h-T-B;let max=Math.max(1,...values.map(Math.abs))*1.15;const y=v=>T+(max-v)/(2*max)*plotH;ctx.strokeStyle='#53647b';ctx.beginPath();ctx.moveTo(L,y(0));ctx.lineTo(w-R,y(0));ctx.stroke();const bw=(w-L-R)/Math.max(values.length,1);values.forEach((v,i)=>{let x=L+i*bw+bw*.18,barW=bw*.64;ctx.fillStyle=v>=0?'#49d7a2':'#f57b86';ctx.fillRect(x,Math.min(y(v),y(0)),barW,Math.max(1,Math.abs(y(v)-y(0))));ctx.fillStyle='#b8c7d9';ctx.font='10px sans-serif';ctx.textAlign='center';if(values.length<=12)ctx.fillText(labels[i],x+barW/2,h-13);else if(i%Math.ceil(values.length/8)===0)ctx.fillText(labels[i],x+barW/2,h-13)});ctx.textAlign='left';ctx.fillStyle='#9eafc6';ctx.font='11px sans-serif';ctx.fillText('+'+num(Math.round(max))+'円',L,T-4);ctx.fillText('−'+num(Math.round(max))+'円',L,h-B+14)}
function renderHistory(){const q=$('filter').value.trim().toLowerCase(),a=entries.filter(r=>(r.machine+' '+r.memo).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));$('records').innerHTML=a.length?a.map(r=>{let d=duration(r);return `<div class="item"><div class="row"><b>${esc(r.machine)}</b><strong class="${cls(profit(r))}">${yen(profit(r))}</strong></div><p class="muted">${esc(r.date)} ｜ 投資 ${yen(r.investment)} / 回収 ${yen(r.returnAmount)}</p><p class="muted">差枚 ${num(r.coins)}枚 ｜ ${num(r.games)}G ｜ 設定 ${esc(r.setting||'不明')} ｜ ${fmtTime(d)} ｜ 時給 ${d?yen(Math.round(profit(r)/(d/60))):'—'}</p>${r.memo?`<p class="muted">${esc(r.memo)}</p>`:''}<div class="actions"><button data-edit="${esc(r.id)}">編集</button><button class="danger" data-delete="${esc(r.id)}">削除</button></div></div>`}).join(''):'<p class="muted">該当する記録はありません。</p>'}
function stats(group){let map=new Map;entries.forEach(r=>{let k=group(r);if(!map.has(k))map.set(k,[]);map.get(k).push(r)});return [...map].map(([name,a])=>({name,...aggregate(a),coins:a.reduce((s,r)=>s+r.coins,0),games:a.reduce((s,r)=>s+r.games,0)})).sort((a,b)=>b.p-a.p)}function statHtml(a){return a.length?a.map(x=>`<div class="item"><div class="row"><b>${esc(x.name)}</b><strong class="${cls(x.p)}">${yen(x.p)}</strong></div><p class="muted">${x.count}戦 ｜ 勝率 ${x.rate.toFixed(1)}% ｜ 時給 ${x.hourly===null?'—':yen(Math.round(x.hourly))}</p><p class="muted">差枚 ${num(x.coins)}枚 ｜ ${num(x.games)}G</p></div>`).join(''):'<p class="muted">記録がありません。</p>'}function render(){if(active==='home')renderHome();if(active==='history')renderHistory();if(active==='analysis'){$('machineStats').innerHTML=statHtml(stats(r=>r.machine));$('settingStats').innerHTML=statHtml(stats(r=>r.setting||'不明'))}if(active==='entry')$('machines').innerHTML=[...new Set(entries.map(r=>r.machine))].map(s=>`<option value="${esc(s)}">`).join('')}
function reset(){ $('recordForm').reset();$('editId').value='';$('date').value=localDate();$('investment').value='0';$('returnAmount').value='0';$('formTitle').textContent='実戦を記録'}$('resetForm').onclick=reset;$('recordForm').onsubmit=e=>{e.preventDefault();let old=$('editId').value;let r={id:old||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())+Math.random()),date:$('date').value,machine:$('machine').value.trim(),investment:Number($('investment').value),returnAmount:Number($('returnAmount').value),start:$('start').value,end:$('end').value,coins:$('coins').value===''?0:Number($('coins').value),games:$('games').value===''?0:Number($('games').value),setting:$('setting').value,memo:$('memo').value};if(!validate(r)){alert('入力内容を確認してください');return}let backup=entries.slice();entries=old?entries.map(x=>x.id===old?r:x):[...entries,r];if(!persist()){entries=backup;return}reset();show('history');notice('記録を保存しました')};$('records').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let id=b.dataset.edit||b.dataset.delete;let r=entries.find(x=>x.id===id);if(!r)return;if(b.dataset.delete){if(!confirm('この実戦記録を削除しますか？'))return;let prev=entries;entries=entries.filter(x=>x.id!==id);if(!persist())entries=prev;render();return}Object.keys(r).forEach(k=>{if($(k))$(k).value=r[k]});$('editId').value=r.id;$('formTitle').textContent='実戦を編集';show('entry')});$('period').onchange=render;$('chartYear').onchange=render;$('filter').oninput=render;window.addEventListener('resize',()=>{if(active==='home')renderHome()});
function download(name,content,type){let blob=new Blob(['\ufeff',content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('csvExport').onclick=()=>{let headers=['日付','機種','投資額','回収額','収支','開始','終了','遊技時間(分)','時給(円)','差枚','ゲーム数','設定','メモ'];let quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';let rows=entries.map(r=>{let d=duration(r);return[r.date,r.machine,r.investment,r.returnAmount,profit(r),r.start,r.end,d??'',d?Math.round(profit(r)/(d/60)):'',r.coins,r.games,r.setting,r.memo].map(quote).join(',')});download('パチスロ収支_'+localDate()+'.csv',[headers.map(quote).join(','),...rows].join('\r\n'),'text/csv;charset=utf-8')};$('jsonExport').onclick=()=>download('パチスロ収支バックアップ_'+localDate()+'.json',JSON.stringify({version:1,entries},null,2),'application/json');$('jsonImport').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.version!==1||!Array.isArray(obj.entries)||!obj.entries.every(validate)||obj.entries.length>100000)throw Error('形式が不正です');if(!confirm(`${obj.entries.length}件を復元します。現在の記録は置換されます。よろしいですか？`))return;let old=entries;entries=obj.entries;if(!persist())entries=old;else{render();notice('復元しました')}}catch(err){alert('JSONの読み込みに失敗しました: '+err.message)}finally{e.target.value=''}};$('clearAll').onclick=()=>{if(!confirm('すべての記録を削除します。事前にバックアップしましたか？'))return;if(!confirm('本当に全件削除しますか？'))return;let old=entries;entries=[];if(!persist())entries=old;render()};load();reset();show('home');if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
